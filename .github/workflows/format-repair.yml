name: Temporary rustfmt repair

on:
  push:
    branches: [feat/bistable-stage0-v2-runner]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bistable-stage0-v2-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/preregistered.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt 1.89"
            git push origin HEAD:feat/bistable-stage0-v2-runner
          fi
