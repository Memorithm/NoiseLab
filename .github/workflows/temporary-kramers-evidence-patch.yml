name: Temporary Kramers Evidence Patch

on:
  push:
    branches:
      - research/kramers-langevin-calibration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kramers-langevin-calibration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply source patch
        run: python3 .github/scripts/patch_kramers_evidence.py
      - name: Format patched source
        run: cargo +1.89.0 fmt --all
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/langevin.rs src/evidence.rs src/lib.rs
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "test: require uncertainty-separated Kramers peak evidence"
          git push origin HEAD:research/kramers-langevin-calibration
