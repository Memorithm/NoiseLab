name: Autopilot rustfmt one-shot

on:
  push:
    branches:
      - agent/u2-array-score-replay

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/u2-array-score-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply pinned formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/autopilot-rustfmt.yml
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting delta was produced.' >&2
            exit 1
          fi
          git commit -m 'style(u2): apply pinned Rust 1.89 formatting'
          git push origin HEAD:agent/u2-array-score-replay
