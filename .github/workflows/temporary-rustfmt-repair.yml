name: Temporary Rustfmt Repair

on:
  push:
    branches:
      - research/kramers-langevin-calibration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kramers-langevin-calibration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo +1.89.0 fmt --all
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply canonical rustfmt to Langevin calibration"
          git push origin HEAD:research/kramers-langevin-calibration
