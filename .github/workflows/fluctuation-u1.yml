name: Fluctuation U1 Report

on:
  pull_request:
    paths:
      - "src/universality.rs"
      - "src/universality_panel.rs"
      - "examples/fluctuation_u1_report.rs"
      - ".github/workflows/fluctuation-u1.yml"
  push:
    branches: [main]
    paths:
      - "src/universality.rs"
      - "src/universality_panel.rs"
      - "examples/fluctuation_u1_report.rs"
      - ".github/workflows/fluctuation-u1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - name: Record exact revision
        run: echo "NoiseLab revision=${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run preregistered Stage U1 report
        run: cargo run --example fluctuation_u1_report
