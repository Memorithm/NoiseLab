name: Fluctuation U1 Report

on:
  pull_request:
    paths:
      - "src/universality.rs"
      - "src/universality_panel.rs"
      - "examples/fluctuation_u1_report.rs"
      - ".github/workflows/fluctuation-u1.yml"
  push:
    branches: [main]
    paths:
      - "src/universality.rs"
      - "src/universality_panel.rs"
      - "examples/fluctuation_u1_report.rs"
      - ".github/workflows/fluctuation-u1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Record exact revision
        run: echo "NoiseLab revision=$GITHUB_SHA"
      - name: Run preregistered Stage U1 report
        run: cargo run --example fluctuation_u1_report
