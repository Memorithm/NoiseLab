name: Research report smoke contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "tests/**"
      - "scripts/*.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/research-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "tests/**"
      - "scripts/*.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/research-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: U2 and FHN executable smoke contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and non-scientific scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_REVISION"
          printf 'source_revision=%s\nscientific_evidence=false\n' "$actual" > artifacts/smoke/provenance.txt
          uname -a >> artifacts/smoke/provenance.txt
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Test report and integrity validators on synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee artifacts/smoke/python-tests.log
      - name: Resolve and retain the actual dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv >> artifacts/smoke/provenance.txt
          cargo -V >> artifacts/smoke/provenance.txt
          cargo generate-lockfile
          cp Cargo.lock artifacts/smoke/Cargo.lock
          sha256sum Cargo.lock >> artifacts/smoke/provenance.txt
          cargo metadata --locked --format-version 1 > artifacts/smoke/cargo-metadata.json
      - name: Build report executables from the retained lockfile
        run: cargo build --locked --examples
      - name: Check rejected flags and repeat each smoke report twice
        run: python3 scripts/check_smoke_reports.py --bin-dir target/debug/examples --output-dir artifacts/smoke
      - name: Capture exact U2 smoke inputs twice without overwriting prior data
        shell: bash
        run: |
          set -euo pipefail
          for run in a b; do
            NOISELAB_U2_FULL=0 NOISELAB_U2_SMOKE=1 \
              NOISELAB_U2_CAPTURE_DIR="artifacts/smoke/u2-inputs-$run" \
              target/debug/examples/fluctuation_u2_report \
              > "artifacts/smoke/u2-captured-$run.tsv" \
              2> "artifacts/smoke/u2-captured-$run.stderr"
            test -s "artifacts/smoke/u2-inputs-$run/INPUTS_COMPLETE"
            test -s "artifacts/smoke/u2-inputs-$run/SURROGATE_SCORES_COMPLETE"
            test -s "artifacts/smoke/u2-inputs-$run/PAIR_RESULTS_COMPLETE"
            test "$(wc -l < "artifacts/smoke/u2-inputs-$run/sources.tsv")" -eq 5
            test "$(wc -l < "artifacts/smoke/u2-inputs-$run/surrogate_jobs.tsv")" -eq 229
            test "$(wc -l < "artifacts/smoke/u2-inputs-$run/pair_results.tsv")" -eq 7
            for family in DrivenDampedOscillator SemiconductorLaser BistableLangevin FitzHughNagumo; do
              test "$(stat -c %s "artifacts/smoke/u2-inputs-$run/$family.f64le")" -eq 65536
            done
          done
          cmp artifacts/smoke/u2-captured-a.tsv artifacts/smoke/u2-captured-b.tsv
          diff -r artifacts/smoke/u2-inputs-a artifacts/smoke/u2-inputs-b
          if NOISELAB_U2_FULL=0 NOISELAB_U2_SMOKE=1 \
            NOISELAB_U2_CAPTURE_DIR=artifacts/smoke/u2-inputs-a \
            target/debug/examples/fluctuation_u2_report \
            > artifacts/smoke/reused-capture.stdout 2> artifacts/smoke/reused-capture.stderr; then
            echo 'An existing capture directory was incorrectly accepted' >&2
            exit 1
          fi
          test ! -s artifacts/smoke/reused-capture.stdout
          diff -r artifacts/smoke/u2-inputs-a artifacts/smoke/u2-inputs-b
      - name: Retain protocol sources and executable identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke/source
          cp --parents Cargo.toml src/u2_*.rs src/universality*.rs src/spectral_null.rs \
            src/report_mode.rs examples/fluctuation_u2_report.rs examples/support/u2_capture.rs \
            examples/support/u2_pair_results.rs examples/support/u2_pair_result_replay.rs \
            examples/support/u2_surrogate_arrays.rs \
            docs/research/fluctuation-universality-u2-stage0.md \
            scripts/evidence_bundle.py artifacts/smoke/source/
          sha256sum target/debug/examples/fluctuation_u2_report \
            target/debug/examples/fhn_horizon_stage0_report > artifacts/smoke/executables.sha256
      - name: Seal and verify retained bytes without granting a scientific verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/evidence_bundle.py seal artifacts/smoke
          python3 scripts/evidence_bundle.py verify artifacts/smoke >> "$GITHUB_STEP_SUMMARY"
      - name: Retain non-scientific reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noiselab-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/smoke/
          if-no-files-found: error
          retention-days: 14
