name: Research report smoke contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "scripts/check_smoke_reports.py"
      - "scripts/test_smoke_reports.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/research-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "scripts/check_smoke_reports.py"
      - "scripts/test_smoke_reports.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/research-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: U2 and FHN executable smoke contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and non-scientific scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_REVISION"
          printf 'source_revision=%s\nscientific_evidence=false\n' "$actual" > artifacts/smoke/provenance.txt
          uname -a >> artifacts/smoke/provenance.txt
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Test report validator on synthetic contract fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_smoke_reports.py' -v 2>&1 | tee artifacts/smoke/python-tests.log
      - name: Resolve and retain the actual dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv >> artifacts/smoke/provenance.txt
          cargo -V >> artifacts/smoke/provenance.txt
          cargo generate-lockfile
          cp Cargo.lock artifacts/smoke/Cargo.lock
          sha256sum Cargo.lock >> artifacts/smoke/provenance.txt
          cargo metadata --locked --format-version 1 > artifacts/smoke/cargo-metadata.json
      - name: Build report executables from the retained lockfile
        run: cargo build --locked --examples
      - name: Check rejected flags and repeat each smoke report twice
        run: python3 scripts/check_smoke_reports.py --bin-dir target/debug/examples --output-dir artifacts/smoke
      - name: Retain non-scientific reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noiselab-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/smoke/
          if-no-files-found: error
          retention-days: 14
