name: Temporary FHN Stage0 rustfmt repair

on:
  push:
    branches:
      - feat/fhn-stage0-decision-gate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fhn_stage0.rs src/lib.rs
          git commit -m "style: apply canonical rustfmt"
          git push
