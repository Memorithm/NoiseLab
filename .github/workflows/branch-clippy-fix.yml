name: Branch clippy fix

on:
  push:
    branches:
      - feat/fhn-stage0-executable-preflight

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fhn-stage0-executable-preflight
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply Clippy machine fixes
        run: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings
      - name: Apply rustfmt after Clippy
        run: cargo fmt --all
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/preregistered.rs src/lib.rs
          git commit -m "style: apply clippy fixes"
          git push origin HEAD:feat/fhn-stage0-executable-preflight
