name: Branch clippy fix

on:
  push:
    branches:
      - feat/fhn-stage0-executable-preflight

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fhn-stage0-executable-preflight
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture Clippy diagnostics
        run: |
          set +e
          cargo clippy -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          cat /tmp/clippy.log
          cp /tmp/clippy.log clippy-diagnostics.txt
          echo "CLIPPY_STATUS=$status" >> clippy-diagnostics.txt
      - name: Commit branch-only diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clippy-diagnostics.txt
          git commit -m "ci: capture clippy diagnostic" || exit 0
          git push origin HEAD:feat/fhn-stage0-executable-preflight
