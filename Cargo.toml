[package]
name = "noiselab"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust research bench for reproducible noise generation, characterization, injection, and resonance studies"
license-file = "LICENSE.md"
repository = "https://github.com/Memorithm/NoiseLab"

[dependencies]
scirust-sim = { git = "https://github.com/Memorithm/scirust.git", rev = "0e2eaccac631b689f97c242c47bad11d433847d9" }
scirust-signal = { git = "https://github.com/Memorithm/scirust.git", rev = "0e2eaccac631b689f97c242c47bad11d433847d9" }
flat-attention = { git = "https://github.com/Memorithm/FLAT-ATTENTION.git", rev = "4529a2079434965e13e90ddd2e98ecc88ee0cb3a" }

[lib]
path = "src/lib.rs"
